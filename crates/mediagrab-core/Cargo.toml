[package]
name = "mediagrab-core"
version = "0.1.0"
edition = "2021"
description = "UI-independent engine: resolve links with yt-dlp and download them in parallel"

[lib]
name = "mediagrab_core"
path = "src/lib.rs"

[[bin]]
name = "mediagrab-cli"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
serde_json = "1"
