[package]
name = "mediagrab-app"
version = "0.1.0"
edition = "2021"
description = "GPUI desktop front end for MediaGrab"
license = "MIT" # <-- change to your real license (and add a LICENSE file)

[[bin]]
name = "mediagrab"
path = "src/main.rs"

[dependencies]
mediagrab-core = { path = "../mediagrab-core" }
# These two are a matched pair: gpui-component 0.5.x is built against gpui 0.2.x.
# Changing one without the other usually breaks the build.
gpui = "0.2.2"
gpui-component = "0.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

# Used by `cargo deb` (Linux .deb package) in the release workflow
[package.metadata.deb]
name = "mediagrab"
maintainer = "MediaGrab Maintainers <noreply@users.noreply.github.com>"
copyright = "2026, MediaGrab contributors"
extended-description = "Download your own videos, music and audio from YouTube and SoundCloud. Bundles yt-dlp, ffmpeg and deno."
section = "video"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0"
assets = [
  ["target/release/mediagrab", "usr/bin/", "755"],
  ["../../dist/tools/*", "usr/lib/mediagrab/tools/", "755"],
  ["../../packaging/linux/mediagrab.desktop", "usr/share/applications/", "644"],
  ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/mediagrab.png", "644"],
]
